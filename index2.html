<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>空いてる日表</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--sub:#6b7385;--line:#e3e6ec;--ac:#3b6cf6;
--c1:#ffe9b8;--c2:#cfe8ff;--c3:#e3d4ff;--c4:#c7c9d9;--c5:#e6e8ee;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171d;--card:#1e222b;--tx:#eef0f5;--sub:#9aa2b5;--line:#2e3441;--ac:#7a9bff;
--c1:#5a4a1f;--c2:#1f4666;--c3:#47346b;--c4:#3a3d57;--c5:#2c313c}}
:root[data-theme="dark"]{--bg:#14171d;--card:#1e222b;--tx:#eef0f5;--sub:#9aa2b5;--line:#2e3441;--ac:#7a9bff;--c1:#5a4a1f;--c2:#1f4666;--c3:#47346b;--c4:#3a3d57;--c5:#2c313c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:16px 12px 40px}
h1{font-size:20px;margin:0 0 4px}
.sub{color:var(--sub);font-size:13px;margin:0 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
input,button{font:inherit;color:inherit}
input[type=date]{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 12px;font-weight:600}
.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--line)}
.legend{display:flex;gap:6px;flex-wrap:wrap;font-size:12px;margin-bottom:12px}
.legend span{padding:3px 8px;border-radius:999px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{border-bottom:1px solid var(--line);text-align:center;padding:0}
th{font-size:12px;color:var(--sub);padding:8px 2px;font-weight:600}
th small{display:block;font-weight:400}
.name{position:sticky;left:0;background:var(--card);min-width:84px;text-align:left;padding:0 4px 0 8px;z-index:1}
.name input{width:68px;border:0;background:transparent;font-weight:600;padding:12px 0}
.name button{border:0;background:none;color:var(--sub);font-size:16px;padding:4px}
td button{width:100%;height:46px;border:0;background:transparent;font-size:16px;font-weight:600}
td button:active{opacity:.6}
.s1{background:var(--c1)}.s2{background:var(--c2)}.s3{background:var(--c3)}.s4{background:var(--c4)}.s5{background:var(--c5);color:var(--sub)}
tfoot td.best{outline:2px solid var(--ok);outline-offset:-2px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px}
.li{padding:10px 12px;border-bottom:1px solid var(--line);font-size:14px}.li:last-child{border:0}.li b{margin-right:6px}
.li.best{background:rgba(26,155,87,.14)}
h2{font-size:15px;margin:18px 0 0}
.mg{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.mg .btn{font-size:13px}
.hint{font-size:12px;color:var(--sub);margin:6px 0}
tfoot td{font-size:12px;color:var(--sub);padding:8px 0}
.s0{background:transparent}
td button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
td button i{font-style:normal;font-size:9px;font-weight:500;color:var(--ok);line-height:1}
:root{--ok:#1a9b57}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ok:#5fd79a}}
:root[data-theme="dark"]{--ok:#5fd79a}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;z-index:9}
.ov.on{display:flex}
.sheet{background:var(--card);width:100%;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.sheet h2{font-size:16px;margin:0 0 12px}
.sheet h3{font-size:13px;color:var(--sub);margin:14px 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:600}
.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;align-items:center}
.row input[type=time]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;flex:1;min-width:0}
.acts{display:flex;gap:8px;margin-top:16px}.acts .btn{flex:1}
.sat{color:#3b6cf6}.sun{color:#e5484d}
</style>
</head>
<body>
<h1>空いてる日表</h1>
<p class="sub">マスをタップして、空いてる日と時間を入力できます。名前も直接編集できます。</p>
<div class="bar">
  <input type="date" id="start" aria-label="週の開始日">
  <button class="btn g" id="prev">◀ 前週</button>
  <button class="btn g" id="next">次週 ▶</button>
  <button class="btn" id="add">＋ 人を追加</button>
</div>
<div class="legend" id="legend"></div>
<div class="wrap"><table id="tbl"></table></div>
<h2>日ごとの空いてる人</h2>
<div class="list" id="who"></div>
<h2>管理</h2>
<div class="mg">
  <button class="btn g" id="clrw">この週の入力を消す</button>
  <button class="btn g" id="clrp">過去の分を消す</button>
  <button class="btn g" id="bk">バックアップをコピー</button>
  <button class="btn g" id="rs">バックアップから戻す</button>
</div>
<p class="hint" id="mgmsg">データはこのスマホ（ブラウザ）の中に保存されます。機種変更や別のスマホで使うときは、バックアップをコピーして、あとで貼り付けて戻してください。</p>
<div class="ov" id="ov"><div class="sheet">
<h2 id="ttl"></h2>
<h3>空いてる時間</h3>
<div class="chips" style="margin-bottom:8px"><button class="chip" id="allday">終日OK</button><button class="chip" id="none">なし</button></div>
<div class="row"><input type="time" id="ft"><span>〜</span><input type="time" id="tt"></div>
<div class="acts"><button class="btn g" id="cancel">キャンセル</button><button class="btn" id="ok">保存</button></div>
</div></div>
<script>
const TYPES=["","早","日","遅","夜","休"];
const NAMES={"早":"早番","日":"日勤","遅":"遅番","夜":"夜勤","休":"休み"};
const DAYS=["日","月","火","水","木","金","土"];
let st={start:"",people:[{n:"Aさん",s:{}},{n:"Bさん",s:{}},{n:"Cさん",s:{}}]};
const KEY="shift-v1";
const WD=["日","月","火","水","木","金","土"];
try{const r=localStorage.getItem(KEY);if(r)st=JSON.parse(r)}catch(e){}
function mondayOf(d){const x=new Date(d);const k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
st.people.forEach(p=>{if(!p.f)p.f={}});
if(!st.start)st.start=iso(mondayOf(new Date()));
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function dates(){const b=new Date(st.start+"T00:00:00");return [...Array(7)].map((_,i)=>{const d=new Date(b);d.setDate(b.getDate()+i);return d})}
function hh(t){const[a,b]=t.split(":");return b==="00"?String(+a):+a+":"+b}
function fmt(f){if(!f)return"";if(f==="終日")return"暇";const[a,b]=f.split("-");return hh(a)+"-"+hh(b)}
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function render(){
  document.getElementById("start").value=st.start;
  document.getElementById("legend").innerHTML='<span class="s2">○：空いてる日</span><span class="s5">・：未入力</span>';
  const ds=dates();
  let h="<thead><tr><th class='name'></th>"+ds.map(d=>{const w=d.getDay();return `<th class="${w==6?'sat':w==0?'sun':''}">${DAYS[w]}<small>${d.getMonth()+1}/${d.getDate()}</small></th>`}).join("")+"</tr></thead><tbody>";
  st.people.forEach((p,pi)=>{
    h+=`<tr><td class="name"><input value="${p.n.replace(/"/g,'&quot;')}" data-p="${pi}" class="ni"><button data-del="${pi}" aria-label="削除">×</button></td>`;
    ds.forEach(d=>{const k=iso(d);const f=p.f[k];
      h+=`<td><button class="${f?'s2':''}" data-p="${pi}" data-k="${k}"><span>${f?"○":"・"}</span><i>${f&&f!=="終日"?fmt(f):""}</i></button></td>`});
    h+="</tr>";
  });
  const cnt=ds.map(d=>st.people.filter(p=>p.f[iso(d)]).length),mx=Math.max(0,...cnt);
  h+="</tbody><tfoot><tr><td class='name'>空き人数</td>"+cnt.map(n=>`<td class="${n&&n===mx&&st.people.length>1?'best':''}">${n}</td>`).join("")+"</tr></tfoot>";
  document.getElementById("who").innerHTML=ds.map((d,i)=>{const k=iso(d);const w=st.people.filter(p=>p.f[k]).map(p=>esc(p.n||"名無し")+(p.f[k]==="終日"?"":"("+esc(fmt(p.f[k]))+")"));
    return `<div class="li${cnt[i]&&cnt[i]===mx&&st.people.length>1?' best':''}"><b>${d.getMonth()+1}/${d.getDate()}(${WD[d.getDay()]})</b>${w.length?w.length+"人："+w.join("、"):"<span style='color:var(--sub)'>だれも未入力</span>"}</div>`}).join("");
  document.getElementById("tbl").innerHTML=h;
}
document.getElementById("tbl").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.del!==undefined){const p=st.people[+b.dataset.del];if(confirm(p.n+" を削除しますか？")){st.people.splice(+b.dataset.del,1);save();render()}return}
  if(b.dataset.k){openSheet(+b.dataset.p,b.dataset.k)}
});
document.getElementById("tbl").addEventListener("change",e=>{
  if(e.target.classList.contains("ni")){st.people[+e.target.dataset.p].n=e.target.value;save()}
});
let cur=null;
const $=id=>document.getElementById(id);
function openSheet(pi,k){
  const p=st.people[pi],d=new Date(k+"T00:00:00");
  cur={pi,k,all:p.f[k]==="終日"};
  const f=p.f[k];
  $("ft").value=f&&f!=="終日"?f.split("-")[0]:"";
  $("tt").value=f&&f!=="終日"?f.split("-")[1]:"";
  $("ttl").textContent=p.n+"　"+(d.getMonth()+1)+"/"+d.getDate()+"（"+WD[d.getDay()]+"）";
  drawSheet();$("ov").classList.add("on");
}
function drawSheet(){
  $("allday").classList.toggle("on",cur.all);
}
$("allday").onclick=()=>{cur.all=!cur.all;if(cur.all){$("ft").value="";$("tt").value=""}drawSheet()};
$("none").onclick=()=>{cur.all=false;$("ft").value="";$("tt").value="";drawSheet()};
["ft","tt"].forEach(i=>$(i).oninput=()=>{cur.all=false;drawSheet()});
$("cancel").onclick=()=>$("ov").classList.remove("on");
$("ov").onclick=e=>{if(e.target.id==="ov")$("ov").classList.remove("on")};
$("ok").onclick=()=>{
  const p=st.people[cur.pi],k=cur.k,a=$("ft").value,b=$("tt").value;
  if(cur.all)p.f[k]="終日";
  else if(a&&b){if(a>=b){alert("終了時刻は開始より後にしてください");return}p.f[k]=a+"-"+b}
  else if(a||b){alert("開始と終了の両方を入れてください");return}
  else delete p.f[k];
  save();render();$("ov").classList.remove("on");
};
document.getElementById("add").onclick=()=>{st.people.push({n:"新しい人",s:{},f:{}});save();render()};
function shift(n){const d=new Date(st.start+"T00:00:00");d.setDate(d.getDate()+n);st.start=iso(d);save();render()}
document.getElementById("prev").onclick=()=>shift(-7);
document.getElementById("next").onclick=()=>shift(7);
document.getElementById("start").onchange=e=>{if(e.target.value){st.start=e.target.value;save();render()}};
const say=t=>{document.getElementById("mgmsg").textContent=t};
document.getElementById("clrw").onclick=()=>{if(!confirm("この週の全員の入力を消しますか？"))return;const ks=dates().map(iso);st.people.forEach(p=>ks.forEach(k=>delete p.f[k]));save();render();say("この週の入力を消しました。")};
document.getElementById("clrp").onclick=()=>{const t=iso(new Date());if(!confirm("今日より前の入力を全部消しますか？"))return;st.people.forEach(p=>Object.keys(p.f).forEach(k=>{if(k<t)delete p.f[k]}));save();render();say("過去の分を消しました。")};
document.getElementById("bk").onclick=async()=>{const t=JSON.stringify({people:st.people});try{await navigator.clipboard.writeText(t);say("バックアップをコピーしました。メモなどに貼って保管してください。")}catch(e){prompt("これをコピーして保管してください",t)}};
document.getElementById("rs").onclick=()=>{const t=prompt("コピーしたバックアップを貼り付けてください");if(!t)return;try{const d=JSON.parse(t);if(!Array.isArray(d.people))throw 0;d.people.forEach(p=>{p.f=p.f||{};p.s=p.s||{}});st.people=d.people;save();render();say("戻しました。")}catch(e){say("バックアップの形式が正しくありません。")}};
render();
</script>
</body>
</html>
